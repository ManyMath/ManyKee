name: manykee_workspace
publish_to: none
environment:
  sdk: ">=3.5.0 <4.0.0"
workspace:
  - packages/keepass
  - packages/keepass/example
  - packages/keepass_cli
  - packages/keepass_flutter
  - packages/keepass_web
  - packages/keepass_ui
  - packages/keepass_web/example
  - packages/keepass_flutter/example
  - apps/web
  - apps/native
  - apps/ManyKee

# The ManyKee app (apps/ManyKee) builds on the manyui library, pinned to a
# commit of its public git mirror. manyui is not yet published, so the hosted
# `manyui` constraint declared by manyui_hooks and manyui_riverpod is
# overridden to the same pinned revision. Bump every `ref:` here and in
# apps/ManyKee/pubspec.yaml together.
#
# To develop against a local ManyUI checkout beside this repository, create an
# untracked pubspec_overrides.yaml at the workspace root. It replaces this
# whole block, so restate every override:
#
#   dependency_overrides:
#     manyui:
#       path: ../ManyUI/manyui
#     manyui_hooks:
#       path: ../ManyUI/manyui_hooks
#     manyui_riverpod:
#       path: ../ManyUI/manyui_riverpod
dependency_overrides:
  manyui:
    git:
      url: https://github.com/ManyMath/ManyUI.git
      ref: 88ad8614877b8fd51f79b84376117b37882df11f
      path: manyui
