name: manykee_workspace
publish_to: none
environment:
  sdk: ">=3.5.0 <4.0.0"
workspace:
  - packages/keepass
  - packages/keepass/example
  - packages/keepass_cli
  - packages/keepass_flutter
  - packages/keepass_web
  - packages/keepass_ui
  - packages/keepass_web/example
  - packages/keepass_flutter/example
  - apps/web
  - apps/native
  - apps/ManyKee

# The ManyKee app (apps/ManyKee) builds on the manyui library, developed in
# lockstep from a sibling checkout (../ManyUI). manyui is not yet published,
# so its packages' hosted self-references are overridden to the sibling paths.
dependency_overrides:
  manyui:
    path: ../ManyUI/manyui
