name: CI -- Native Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout ManyKee
        uses: actions/checkout@v4
        with:
          path: ManyKee

      - name: Require dependency checkout token
        env:
          DEPENDENCY_CHECKOUT_TOKEN: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}
        run: |
          if [ -z "${DEPENDENCY_CHECKOUT_TOKEN:-}" ]; then
            echo "DEPENDENCY_CHECKOUT_TOKEN must be a read-only PAT that can clone sneurlax/manyui" >&2
            exit 1
          fi

      - name: Checkout pinned ManyUI
        uses: actions/checkout@v4
        with:
          repository: sneurlax/manyui
          ref: e1dd57073d9fef27e2166d399e9b929b4f72da8b
          path: ManyUI
          token: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ManyKee/rust -> ManyKee/rust/target

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libblkid-dev \
            liblzma-dev \
            xvfb

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install app dependencies
        working-directory: ManyKee/apps/native
        run: flutter pub get

      - name: Pre-build Linux debug bundle
        working-directory: ManyKee/apps/native
        run: timeout --signal=TERM --kill-after=30s 20m flutter build linux --debug

      - name: Run native integration tests
        working-directory: ManyKee/apps/native
        run: >-
          timeout --signal=TERM --kill-after=30s 20m
          xvfb-run --auto-servernum flutter test integration_test -d linux -r github
