name: CI -- Web E2E Tests

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  puppeteer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> rust/target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: packages/keepass_web/example/test/e2e/package-lock.json

      - name: Install Xvfb
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Puppeteer dependencies
        working-directory: packages/keepass_web/example/test/e2e
        run: npm ci

      - name: Build Chrome extension
        env:
          MANYKEE_E2E_SEMANTICS: '1'
        run: bash scripts/build_extension.sh

      - name: Run Puppeteer E2E tests
        working-directory: packages/keepass_web/example/test/e2e
        env:
          CI: 'true'
          HEADFUL: '1'
        run: xvfb-run --auto-servernum npm run test:only
