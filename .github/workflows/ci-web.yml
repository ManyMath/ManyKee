name: CI -- Web E2E Tests

on:
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  puppeteer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout ManyKee
        uses: actions/checkout@v4
        with:
          path: ManyKee

      - name: Require dependency checkout token
        env:
          DEPENDENCY_CHECKOUT_TOKEN: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}
        run: |
          if [ -z "${DEPENDENCY_CHECKOUT_TOKEN:-}" ]; then
            echo "DEPENDENCY_CHECKOUT_TOKEN must be a read-only PAT that can clone sneurlax/manyui" >&2
            exit 1
          fi

      - name: Checkout pinned ManyUI
        uses: actions/checkout@v4
        with:
          repository: sneurlax/manyui
          ref: e1dd57073d9fef27e2166d399e9b929b4f72da8b
          path: ManyUI
          token: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ManyKee/rust -> ManyKee/rust/target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ManyKee/packages/keepass_web/example/test/e2e/package-lock.json

      - name: Install Xvfb
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Puppeteer dependencies
        working-directory: ManyKee/packages/keepass_web/example/test/e2e
        run: npm ci

      - name: Build Chrome extension
        working-directory: ManyKee
        env:
          MANYKEE_E2E_SEMANTICS: '1'
        run: timeout --signal=TERM --kill-after=30s 20m bash scripts/build_extension.sh

      - name: Run Puppeteer E2E tests
        working-directory: ManyKee/packages/keepass_web/example/test/e2e
        env:
          CI: 'true'
          HEADFUL: '1'
        run: >-
          timeout --signal=TERM --kill-after=30s 30m
          xvfb-run --auto-servernum npm run test:only
