name: CI -- Web E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  puppeteer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout ManyKee
        uses: actions/checkout@v4
        with:
          path: ManyKee

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ManyKee/rust -> ManyKee/rust/target

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ManyKee/packages/keepass_web/example/test/e2e/package-lock.json

      - name: Install Xvfb
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Puppeteer dependencies
        working-directory: ManyKee/packages/keepass_web/example/test/e2e
        run: npm ci

      - name: Build Chrome extension
        working-directory: ManyKee
        env:
          MANYKEE_E2E_SEMANTICS: '1'
        run: timeout --signal=TERM --kill-after=30s 20m bash scripts/build_extension.sh

      - name: Run Puppeteer E2E tests
        working-directory: ManyKee/packages/keepass_web/example/test/e2e
        env:
          CI: 'true'
          HEADFUL: '1'
        run: >-
          timeout --signal=TERM --kill-after=30s 30m
          xvfb-run --auto-servernum npm run test:only
