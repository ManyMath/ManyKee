name: CI -- Core Libraries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ManyKee
        uses: actions/checkout@v4
        with:
          path: ManyKee
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ManyKee/rust
      - name: Check formatting
        working-directory: ManyKee/rust
        run: cargo fmt --all -- --check
      - name: Test workspace
        working-directory: ManyKee/rust
        run: >-
          timeout --signal=TERM --kill-after=30s 30m
          cargo test --locked --workspace
      - name: Test keepass-rs with default and single save features
        working-directory: ManyKee/rust
        run: |
          cargo test --locked -p keepass --lib
          cargo test --locked -p keepass --lib --features save_kdbx3
      - name: Check wasm target compiles
        working-directory: ManyKee/rust
        run: cargo check --locked -p keepassxc-wasm --target wasm32-unknown-unknown
      - name: Verify compatibility matrix is current
        working-directory: ManyKee/rust
        run: cargo run --locked -q -p keepassxc --bin generate_compat_matrix -- --check

  dart-packages:
    name: Dart package tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ManyKee
        uses: actions/checkout@v4
        with:
          path: ManyKee
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ManyKee/rust
      - name: Build native library
        working-directory: ManyKee/rust
        run: cargo build --locked -p keepassxc-ffi
      - name: Resolve workspace dependencies
        working-directory: ManyKee/packages/keepass
        run: flutter pub get
      - name: Check package formatting
        working-directory: ManyKee
        run: >-
          dart format --output none --set-exit-if-changed
          packages/keepass/lib packages/keepass/test
          packages/keepass_cli/lib packages/keepass_cli/test
          packages/keepass_web/lib packages/keepass_web/test
          packages/keepass_web/example/lib
          apps/web/lib apps/native/lib apps/native/test
      - name: Analyze packages
        working-directory: ManyKee
        run: |
          for package in packages/keepass packages/keepass_cli packages/keepass_web packages/keepass_flutter; do
            (cd "$package" && dart analyze --fatal-infos)
          done
      - name: Test keepass
        working-directory: ManyKee/packages/keepass
        run: timeout --signal=TERM --kill-after=30s 10m dart test
      - name: Test keepass_cli
        working-directory: ManyKee/packages/keepass_cli
        run: timeout --signal=TERM --kill-after=30s 10m dart test
      - name: Test keepass_web
        working-directory: ManyKee/packages/keepass_web
        run: timeout --signal=TERM --kill-after=30s 10m flutter test
