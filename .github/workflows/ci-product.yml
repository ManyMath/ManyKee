name: CI -- ManyKee Product

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-site:
    name: App tests and canonical web distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout ManyKee
        uses: actions/checkout@v4
        with:
          path: ManyKee
      - name: Require dependency checkout token
        env:
          DEPENDENCY_CHECKOUT_TOKEN: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}
        run: |
          if [ -z "${DEPENDENCY_CHECKOUT_TOKEN:-}" ]; then
            echo "DEPENDENCY_CHECKOUT_TOKEN must be a read-only PAT that can clone sneurlax/manyui" >&2
            exit 1
          fi
      - name: Checkout pinned ManyUI
        uses: actions/checkout@v4
        with:
          repository: sneurlax/manyui
          ref: e1dd57073d9fef27e2166d399e9b929b4f72da8b
          path: ManyUI
          token: ${{ secrets.DEPENDENCY_CHECKOUT_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ManyKee/rust
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build native library for app tests
        working-directory: ManyKee/rust
        run: cargo build --locked -p keepassxc-ffi
      - name: Resolve app dependencies
        working-directory: ManyKee/apps/ManyKee
        run: flutter pub get
      - name: Check app formatting
        working-directory: ManyKee
        run: >-
          dart format --output none --set-exit-if-changed
          apps/ManyKee/lib apps/ManyKee/test
          packages/keepass_ui/lib packages/keepass_ui/test
      - name: Analyze canonical app
        working-directory: ManyKee/apps/ManyKee
        run: flutter analyze
      - name: Test canonical app
        working-directory: ManyKee/apps/ManyKee
        run: >-
          timeout --signal=TERM --kill-after=30s 25m
          flutter test --concurrency=1
      - name: Test shared vault UI package
        working-directory: ManyKee/packages/keepass_ui
        run: >-
          timeout --signal=TERM --kill-after=30s 10m
          flutter test
      - name: Build canonical site and app
        working-directory: ManyKee
        run: >-
          timeout --signal=TERM --kill-after=30s 30m
          ./apps/ManyKee.com/tool/build_web.sh
      - name: Verify canonical distribution
        working-directory: ManyKee
        run: ./apps/ManyKee.com/tool/verify_web_dist.sh
      - name: Upload canonical distribution
        uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
        with:
          name: manykee-web
          path: ManyKee/apps/ManyKee.com/build/dist
          if-no-files-found: error
          retention-days: 7
