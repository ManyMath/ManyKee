[package]
name = "keepassxc-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.80.1"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
keepassxc = { path = "../keepassxc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

[build-dependencies]
cbindgen = "0.27"
