[package]
name = "keepassxc"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[features]
default = ["yubikey"]
yubikey = ["keepass/challenge_response"]
totp = ["keepass/totp"]

[dependencies]
keepass = { path = "../keepass-rs", features = ["save_kdbx4", "_merge", "totp"] }
thiserror = "1"
uuid = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
chacha20 = "0.9"
rust-argon2 = "2.1"
cipher = { version = "0.4", features = ["std"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
