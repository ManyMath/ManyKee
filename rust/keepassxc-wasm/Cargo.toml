[package]
name = "keepassxc-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.82.0"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
keepassxc = { path = "../keepassxc", default-features = false }
keepass = { path = "../keepass-rs", features = ["save_kdbx4", "_merge"] }
wasm-bindgen = "=0.2.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
uuid = "1"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
console_error_panic_hook = "0.1.7"

[dev-dependencies]
wasm-bindgen-test = "0.3"
