name: keepass_flutter
description: Flutter plugin for KeePass KDBX databases; bundles a Rust core via cargokit and re-exports package:keepass.
version: 0.1.0
repository: https://github.com/ManyMath/ManyKee
homepage: https://github.com/ManyMath/ManyKee/tree/main/packages/keepass_flutter
issue_tracker: https://github.com/ManyMath/ManyKee/issues
resolution: workspace

topics:
  - keepass
  - kdbx
  - password
  - ffi
  - flutter

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  keepass: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
