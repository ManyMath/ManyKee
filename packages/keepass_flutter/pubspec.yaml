name: keepass_flutter
description: Flutter plugin providing KeePass KDBX support via Rust FFI
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.10
  keepass:
    path: ../keepass
  keepass_ui:
    path: ../keepass_ui

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
