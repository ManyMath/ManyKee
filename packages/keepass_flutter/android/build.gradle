// The Android build is handled by cargokit through the Flutter build system.
// This file exists to satisfy Flutter's plugin structure requirements.
group 'com.manykee.keepass_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply from: '../cargokit/gradle/plugin.gradle'

android {
    // AndroidX dependencies used by current Flutter require API 34.
    compileSdkVersion 34
    namespace 'com.manykee.keepass_flutter'

    defaultConfig {
        minSdkVersion 21
    }
}

// The staged package carries this complete native crate and its source closure.
cargokit {
    manifestDir = "../rust"
    libname = "keepass_flutter_native"
}
