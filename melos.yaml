name: manykee
packages:
  - packages/*

scripts:
  format:
    run: dart format .
    exec:
      concurrency: 1
  analyze:
    run: dart analyze --fatal-infos
    exec:
      concurrency: 1
  test:
    run: dart test
    exec:
      concurrency: 1
      failFast: true
  build:extension:
    run: bash $MELOS_ROOT_PATH/scripts/build_extension.sh
    description: Build Chrome MV3 extension from Flutter web output
  ffigen:
    run: dart run ffigen --config ffigen.yaml
    packageFilters:
      fileExists:
        - ffigen.yaml
