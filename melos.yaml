name: manykee
packages:
  - packages/*
  - packages/*/example
  - apps/*

scripts:
  format:
    run: dart format .
    exec:
      concurrency: 1
  analyze:
    run: dart analyze --fatal-infos
    exec:
      concurrency: 1
  test:dart:
    run: dart test
    description: Run pure-Dart package tests (requires a built libkeepassxc_ffi)
    exec:
      concurrency: 1
      failFast: true
    packageFilters:
      flutter: false
      dirExists:
        - test
  test:flutter:
    run: flutter test
    description: Run Flutter package and app unit tests
    exec:
      concurrency: 1
      failFast: true
    packageFilters:
      flutter: true
      dirExists:
        - test
  build:extension:
    run: bash $MELOS_ROOT_PATH/scripts/build_extension.sh
    description: Build Chrome MV3 extension from Flutter web output
  verify:compat:official:
    run: bash $MELOS_ROOT_PATH/scripts/verify_official_compat.sh
    description: Run the official-tool compatibility workflow (required-mode)
  verify:compat:parity:
    run: bash $MELOS_ROOT_PATH/scripts/verify_bidirectional_parity.sh
    description: Run the bidirectional KeePassXC CLI parity workflow (required-mode)
  test:e2e:
    run: cd $MELOS_ROOT_PATH/packages/keepass_web/example/test/e2e && npm install --silent && npm run test:only
    description: Run Puppeteer E2E tests against Chrome extension (requires build:extension first)
  test:integration:
    run: flutter test integration_test -d linux
    description: Run Flutter integration tests (Linux desktop)
    exec:
      concurrency: 1
      failFast: true
    packageFilters:
      dirExists:
        - integration_test
      ignore:
        - keepass_web_example
  ffigen:
    run: dart run ffigen --config ffigen.yaml
    packageFilters:
      fileExists:
        - ffigen.yaml
