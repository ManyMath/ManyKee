name: manykee
packages:
  - packages/*
  - apps/*

scripts:
  format:
    run: dart format .
    exec:
      concurrency: 1
  analyze:
    run: dart analyze --fatal-infos
    exec:
      concurrency: 1
  test:
    run: dart test
    exec:
      concurrency: 1
      failFast: true
  build:extension:
    run: bash $MELOS_ROOT_PATH/scripts/build_extension.sh
    description: Build Chrome MV3 extension from Flutter web output
  test:e2e:
    run: cd $MELOS_ROOT_PATH/packages/keepass_web/example/test/e2e && npm install --silent && npm run test:only
    description: Run Puppeteer E2E tests against Chrome extension (requires build:extension first)
  test:integration:
    run: flutter test integration_test -d linux
    description: Run Flutter integration tests (Linux desktop)
    exec:
      concurrency: 1
      failFast: true
    packageFilters:
      dirExists:
        - integration_test
      ignore:
        - keepass_web_example
  ffigen:
    run: dart run ffigen --config ffigen.yaml
    packageFilters:
      fileExists:
        - ffigen.yaml
