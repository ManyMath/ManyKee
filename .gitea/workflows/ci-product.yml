name: CI -- ManyKee Product
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app-site:
    name: App tests and canonical web distribution
    runs-on: manymath-maintenance-linux-x64
    timeout-minutes: 60
    steps:
    - name: Require private primary forge
      env:
        PRIMARY_SERVER: ${{ github.server_url }}
      run: 'test "$PRIMARY_SERVER" = ''https://git.manymath.com''

        rustc --version

        cargo --version

        flutter --version

        '
    - name: Checkout ManyKee
      uses: actions/checkout@v4
      with:
        path: ManyKee
    - name: Verify provisioned wasm-pack
      run: 'command -v wasm-pack

        wasm-pack --version'
    - name: Build native library for app tests
      working-directory: ManyKee/rust
      run: cargo build --locked -p keepassxc-ffi
    - name: Resolve app dependencies
      working-directory: ManyKee/apps/ManyKee
      run: flutter pub get
    - name: Check app formatting
      working-directory: ManyKee
      run: dart format --output none --set-exit-if-changed apps/ManyKee/lib apps/ManyKee/test
        packages/keepass_ui/lib packages/keepass_ui/test
    - name: Analyze canonical app
      working-directory: ManyKee/apps/ManyKee
      run: flutter analyze
    - name: Test canonical app
      working-directory: ManyKee/apps/ManyKee
      run: timeout --signal=TERM --kill-after=30s 25m flutter test --concurrency=1
    - name: Test shared vault UI package
      working-directory: ManyKee/packages/keepass_ui
      run: timeout --signal=TERM --kill-after=30s 10m flutter test
    - name: Build canonical site and app
      working-directory: ManyKee
      run: timeout --signal=TERM --kill-after=30s 30m ./apps/ManyKee.com/tool/build_web.sh
    - name: Verify canonical distribution
      working-directory: ManyKee
      run: ./apps/ManyKee.com/tool/verify_web_dist.sh
    - name: Upload canonical distribution
      uses: ChristopherHX/gitea-upload-artifact@81f940d004763f986ba3582c007fd842dd5cb0d7
      with:
        name: manykee-web
        path: ManyKee/apps/ManyKee.com/build/dist
        if-no-files-found: error
        retention-days: 7
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
    - dev
  workflow_dispatch: {}
env:
  DASH__SUPPRESS_ANALYTICS: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  CI: 'true'
  CARGO_HOME: ${{ runner.temp }}/manykee-cargo-${{ github.run_id }}-${{ github.job
    }}
  RUSTUP_TOOLCHAIN: 1.94.0
  CARGO_BUILD_JOBS: '3'
